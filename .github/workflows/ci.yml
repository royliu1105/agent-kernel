name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agent_kernel
          POSTGRES_USER: agent_kernel
          POSTGRES_PASSWORD: agent_kernel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_kernel -d agent_kernel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - name: Sync Python workspace
        run: uv sync --dev
      - name: SQLite migration smoke
        run: DATABASE_URL=sqlite:////tmp/agent-kernel-ci.db uv run alembic upgrade head
      - name: Postgres migration smoke
        run: DATABASE_URL=postgresql+psycopg://agent_kernel:agent_kernel@localhost:5432/agent_kernel uv run alembic upgrade head
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy .
      - name: Test
        run: uv run pytest
      - name: Release Eval Gates
        run: make release-eval

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: Typecheck Web
        run: npm run lint
      - name: Build Web
        run: npm run build
      - name: Install Playwright
        run: npm --workspace apps/web exec playwright install --with-deps chromium
      - name: Smoke Test Web
        run: npm run test:e2e

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config

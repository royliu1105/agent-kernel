name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - name: Sync Python workspace
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy .
      - name: Test
        run: uv run pytest
      - name: Cheap Eval
        run: uv run agent-kernel eval report evals/rag-smoke.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: Typecheck Web
        run: npm run lint
      - name: Build Web
        run: npm run build
      - name: Install Playwright
        run: npm --workspace apps/web exec playwright install --with-deps chromium
      - name: Smoke Test Web
        run: npm run test:e2e

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config

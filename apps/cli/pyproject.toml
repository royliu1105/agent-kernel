[project]
name = "agent-kernel-cli"
version = "0.1.0"
description = "Command line interface for Agent Kernel."
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27.0",
  "kernel-core",
  "typer>=0.12.0",
]

[project.scripts]
agent-kernel = "agent_kernel_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_kernel_cli"]

{
  "apiVersion": 1,
  "datasources": [
    {
      "name": "Agent Kernel Logs", "uid": "agent-kernel-loki", "type": "loki",
      "access": "proxy", "url": "http://loki:3100", "editable": false,
      "jsonData": {"maxLines": 500, "derivedFields": [{
        "name": "TraceID", "matcherRegex": "\"trace_id\":\"([a-f0-9]{32})\"",
        "datasourceUid": "agent-kernel-tempo", "url": "$${__value.raw}"
      }]}
    },
    {
      "name": "Agent Kernel Traces", "uid": "agent-kernel-tempo", "type": "tempo",
      "access": "proxy", "url": "http://tempo:3200", "editable": false,
      "jsonData": {"tracesToLogsV2": {
        "datasourceUid": "agent-kernel-loki", "spanStartTimeShift": "-5m", "spanEndTimeShift": "5m",
        "customQuery": true, "query": "{job=\"agent-kernel\"} | json | trace_id=\"$${__span.traceId}\""
      }}
    }
  ]
}

[project]
name = "kernel-evals"
version = "1.0.0"
description = "Evaluation package for Agent Kernel."
requires-python = ">=3.12,<3.13"
dependencies = ["kernel-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_evals"]

[project]
name = "kernel-rag"
version = "0.1.0"
description = "RAG package for Agent Kernel."
requires-python = ">=3.12,<3.13"
dependencies = ["kernel-core", "kernel-storage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_rag"]

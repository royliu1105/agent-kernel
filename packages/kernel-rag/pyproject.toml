[project]
name = "kernel-rag"
version = "1.0.0"
description = "RAG package for Agent Kernel."
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27.0",
  "kernel-core",
  "kernel-observability",
  "kernel-storage",
  "kernel-tools",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_rag"]

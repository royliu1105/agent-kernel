[project]
name = "kernel-storage"
version = "0.1.0"
description = "Storage adapters for Agent Kernel."
requires-python = ">=3.12,<3.13"
dependencies = ["kernel-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_storage"]

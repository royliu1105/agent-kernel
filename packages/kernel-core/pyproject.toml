[project]
name = "kernel-core"
version = "0.1.0"
description = "Core domain models and interfaces for Agent Kernel."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_core"]

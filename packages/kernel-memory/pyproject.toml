[project]
name = "kernel-memory"
version = "1.0.0"
description = "Memory package for Agent Kernel."
requires-python = ">=3.12,<3.13"
dependencies = ["kernel-core", "kernel-storage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_memory"]

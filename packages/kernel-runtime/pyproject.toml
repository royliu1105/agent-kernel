[project]
name = "kernel-runtime"
version = "0.1.0"
description = "Agent runtime package for Agent Kernel."
requires-python = ">=3.12,<3.13"
dependencies = [
  "kernel-core",
  "kernel-policy",
  "kernel-providers",
  "kernel-storage",
  "kernel-tools",
  "pydantic>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_runtime"]
